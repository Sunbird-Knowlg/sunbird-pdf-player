<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbird PDF Player — Dev</title>
  <!--
    In dev mode (npm run dev), Vite processes src/index.css directly.
    In production, use the stylesheet from dist/style.css.
  -->
  <link rel="stylesheet" href="/src/index.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100dvh; display: flex; flex-direction: column; background: #0f172a; }
    #player-container { flex: 1; overflow: hidden; }
    sunbird-pdf-player { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player-container">
    <sunbird-pdf-player id="pdf-player"></sunbird-pdf-player>
  </div>

  <!-- In dev mode Vite compiles TypeScript directly from source -->
  <script type="module" src="/src/sunbird-pdf-player.ts"></script>

  <script>
    const playerConfig = {
      context: {
        mode: 'play',
        sid: '7283cf2e-d215-9944-b0c5-269489c6fa56',
        did: '3c0a3724311fe944dec5df559cc4e006',
        uid: 'anonymous',
        channel: '505c7c48ac6dc1edc9b08f21db5a571d',
        pdata: { id: 'sunbird.portal', ver: '3.2.12', pid: 'sunbird-portal.contentplayer' },
        userData: { firstName: 'Guest', lastName: '' }
      },
      config: {
        toolBar: { showZoomButtons: true, showPagesButton: true, showPagingButtons: true, showRotateButton: true },
        sideMenu: { showShare: true, showDownload: true, showReplay: true, showExit: false, showPrint: true }
      },
      metadata: {
        identifier: 'dev-001',
        name: 'Bhagavad Gita (sample)',
        artifactUrl: '/src/assets/gita.pdf'
      }
    };

    document.getElementById('pdf-player').playerConfig = playerConfig;

    document.getElementById('pdf-player').addEventListener('playerEvent',   (e) => console.log('[playerEvent]',   e.detail));
    document.getElementById('pdf-player').addEventListener('telemetryEvent',(e) => console.log('[telemetryEvent]',e.detail));
  </script>
</body>
</html>
