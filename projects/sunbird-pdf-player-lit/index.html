<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunbird PDF Player Lit Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #player-container { flex: 1; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="player-container">
        <sunbird-pdf-player id="pdf-player"></sunbird-pdf-player>
    </div>
    <script type="module" src="/src/sunbird-pdf-player.ts"></script>
    <script>
        const playerConfig = {
            "context": {
                "mode": "play", "authToken": "", "sid": "7283cf2e-d215-9944-b0c5-269489c6fa56",
                "did": "3c0a3724311fe944dec5df559cc4e006", "uid": "anonymous", "channel": "505c7c48ac6dc1edc9b08f21db5a571d",
                "pdata": { "id": "sunbird.portal", "ver": "3.2.12", "pid": "sunbird-portal.contentplayer" }
            },
            "config": { "sideMenu": { "showShare": true, "showDownload": true, "showReplay": true, "showExit": false, "showPrint": true } },
            "metadata": {
                "identifier": "do_31291455031832576019477", "name": "Sample PDF",
                "artifactUrl": "https://ntpproductionall.blob.core.windows.net/ntp-content-production/content/assets/do_31291458881611366418883/b331332333_std_5_mathssciencesocial_tm_term-1_opt.pdf"
            }
        };
        window.addEventListener('load', () => {
            const playerElement = document.getElementById('pdf-player');
            playerElement.setAttribute('player-config', JSON.stringify(playerConfig));
            playerElement.addEventListener('playerEvent', (e) => console.log("On playerEvent", e.detail));
            playerElement.addEventListener('telemetryEvent', (e) => console.log("On telemetryEvent", e.detail));
        });
    </script>
</body>
</html>
