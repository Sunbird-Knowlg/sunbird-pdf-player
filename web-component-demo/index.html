<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbird PDF Player — Demo</title>

  <!--
    CSS from the Lit component build.
    When embedding in a portal, import this stylesheet in the portal's head,
    or inline it into the portal's global stylesheet.
  -->
  <link rel="stylesheet" href="../projects/sunbird-pdf-player-lit/dist/style.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f0f0;
    }

    header {
      padding: 12px 20px;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #player-container {
      flex: 1;
      overflow: hidden;
    }

    sunbird-pdf-player {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Custom theme example ───────────────────────────────────────────────
       Override any token here to change the player's look without touching
       the component source code. The same technique works inside a portal
       or mobile WebView by injecting CSS variables.
    ─────────────────────────────────────────────────────────────────────── */
    /*
    sunbird-pdf-player {
      --pdf-primary:     #7c3aed;
      --pdf-primary-hover: #6d28d9;
      --pdf-header-bg:   #1e1e2e;
      --pdf-header-text: #cdd6f4;
    }
    */
  </style>
</head>

<body>
  <header>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    Sunbird PDF Player Demo
    <span style="margin-left:auto;opacity:.6;font-size:12px;">
      Open browser console to see player &amp; telemetry events
    </span>
  </header>

  <div id="player-container">
    <sunbird-pdf-player id="pdf-player"></sunbird-pdf-player>
  </div>

  <!--
    Load the Lit web component bundle.
    In a production portal you'd reference the versioned file from a CDN.
  -->
  <script type="module" src="../projects/sunbird-pdf-player-lit/dist/sunbird-pdf-player.js"></script>

  <script>
    /**
     * Sample playerConfig — mirrors the format used by the Angular version
     * so existing consumers can migrate without changing their config.
     */
    const playerConfig = {
      context: {
        mode: 'play',
        sid: '7283cf2e-d215-9944-b0c5-269489c6fa56',
        did: '3c0a3724311fe944dec5df559cc4e006',
        uid: 'anonymous',
        channel: '505c7c48ac6dc1edc9b08f21db5a571d',
        pdata: { id: 'sunbird.portal', ver: '3.2.12', pid: 'sunbird-portal.contentplayer' },
        contextRollup: { l1: '505c7c48ac6dc1edc9b08f21db5a571d' },
        userData: { firstName: 'Guest', lastName: '' }
      },
      config: {
        toolBar: {
          showZoomButtons:   true,
          showPagesButton:   true,
          showPagingButtons: true,
          showRotateButton:  true
        },
        sideMenu: {
          showShare:    true,
          showDownload: true,
          showReplay:   true,
          showExit:     false,
          showPrint:    true
        }
      },
      metadata: {
        identifier: 'do_31291455031832576019477',
        name: 'Sample PDF — Bhagavad Gita',
        artifactUrl: 'https://www.w3.org/WAI/WCAG21/Techniques/pdf/sample.pdf'
      }
    };

    window.addEventListener('load', () => {
      const player = document.getElementById('pdf-player');

      // Set config via JS property (works for objects)
      player.playerConfig = playerConfig;

      // OR set via attribute (JSON string):
      // player.setAttribute('player-config', JSON.stringify(playerConfig));

      // ── Listen for output events ────────────────────────────────────────
      player.addEventListener('playerEvent', (e) => {
        console.log('%c[playerEvent]', 'color:#1a73e8;font-weight:bold', e.detail);
      });

      player.addEventListener('telemetryEvent', (e) => {
        console.log('%c[telemetryEvent]', 'color:#16a34a;font-weight:bold', e.detail);
      });

      // ── External action example ──────────────────────────────────────────
      // You can trigger actions programmatically:
      // player.action = 'NEXT';
      // player.action = 'ZOOM_IN';
      // player.action = 'REPLAY';
    });
  </script>
</body>
</html>
