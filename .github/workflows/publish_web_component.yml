name: Publish web-component demo artefacts

# This workflow publishes the built web-component demo files as a GitHub
# Release asset whenever a tag is pushed, so consumers can reference a
# specific versioned bundle directly without installing from NPM.
#
# The NPM package itself is published by publish_module.yml.

on:
  push:
    tags:
      - '*'

jobs:
  release-assets:
    name: Attach dist to GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create/upload release assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack dist as zip
        run: |
          cd dist
          zip -r ../sunbird-pdf-player-${{ github.ref_name }}.zip .
          cd ..

      - name: Create / update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: sunbird-pdf-player-${{ github.ref_name }}.zip
          generate_release_notes: true
